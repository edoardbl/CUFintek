<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aplikasi Penagihan TP Saluampak</title>
    
    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Aplikasi Penagihan TP Saluampak" />
    <link rel="manifest" href="site.webmanifest" />
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Penagihan TP Saluampak">
    <meta name="apple-mobile-web-app-title" content="Penagihan TP Saluampak">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#a60000">

    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; height: 100dvh;
            overflow: hidden; background-color: #f7f7f7; 
        }
        .iframe-container { position: relative; width: 100%; height: 100%; overflow: hidden; }
        .iframe-cutter { position: absolute; width: 100%; height: 100%; top: -5px; overflow: hidden; }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div class="iframe-container">
        <div class="iframe-cutter">
            <iframe 
                id="appIframe"
                src="https://script.google.com/macros/s/AKfycbw-UTsuDTlu9w7qGSIyAgultYclhLTQnWEUkYiICPSDmPlxamUWWhyZyFhNmgdQayej/exec"
                allow="geolocation *">
            </iframe>
        </div>
    </div>
<script>
    // Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('/CUFintek/sw.js')
                .then(function(reg) { console.log('SW didaftarkan:', reg.scope); })
                .catch(function(err) { console.log('SW gagal:', err); });
        });
    }

    // ⭐ Variabel domain — sesuaikan kalau domain berubah
    var GITHUB_WRAPPER_URL = 'https://edoardbl.github.io/CUFintek/';

    // ⭐ Loading overlay untuk parent
    function tampilkanLoadingParent() {
        if (document.getElementById('parentLoadingOverlay')) return;

        var ov = document.createElement('div');
        ov.id = 'parentLoadingOverlay';
        ov.style.cssText = 
            'position:fixed;top:0;left:0;right:0;bottom:0;' +
            'background:linear-gradient(135deg,#8B0000,#A31515);' +
            'z-index:999999;display:flex;flex-direction:column;' +
            'align-items:center;justify-content:center;' +
            'color:white;font-family:sans-serif;text-align:center;padding:20px;';
        ov.innerHTML = 
            '<div style="width:60px;height:60px;border:5px solid rgba(255,215,0,0.3);' +
            'border-top-color:#FFD700;border-radius:50%;' +
            'animation:spin 0.8s linear infinite;margin-bottom:20px;"></div>' +
            '<div style="font-size:16px;font-weight:bold;margin-bottom:8px;">Memuat Ulang Aplikasi...</div>' +
            '<div style="font-size:13px;opacity:0.85;max-width:300px;line-height:1.5;">' +
            'Cache sudah dibersihkan. Mohon tunggu sebentar.</div>';

        if (!document.getElementById('spinStyleParent')) {
            var s = document.createElement('style');
            s.id = 'spinStyleParent';
            s.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
            document.head.appendChild(s);
        }

        document.body.appendChild(ov);
    }

    // ⭐ LISTENER PESAN DARI IFRAME
    window.addEventListener('message', function(event) {
        if (!event.data || event.data.action !== 'force_reload_from_iframe') return;
        
        console.log('📩 Menerima perintah reload dari iframe...');
        
        // Tampilkan loading
        tampilkanLoadingParent();
        
        // ⭐ KUNCI: Reload SELURUH halaman GitHub (bukan cuma iframe)
        // Ini akan menghancurkan iframe lama dan memuat iframe baru
        setTimeout(function() {
            var newUrl = GITHUB_WRAPPER_URL + '?refresh=' + new Date().getTime();
            console.log('🔄 Reload ke:', newUrl);
            window.location.href = newUrl;
        }, 500);
    });

  // ⭐ SISTEM JEMBATAN NAVIGASI (GITHUB ↔ GAS)
  // Prinsip:
  //  - Tombol back HP di Android → Android kirim event ke WebView wrapper
  //  - Wrapper kirim postMessage 'navigate_back' ke iframe GAS
  //  - GAS handle back (pop stack) → kalau sudah di beranda, kirim 'request_exit'
  //  - Wrapper terima 'request_exit' → biarkan Android/browser yang mundur

  function kirimNavigateBackKeIframe() {
    var iframe = document.getElementById('appIframe');
    if (iframe && iframe.contentWindow) {
      iframe.contentWindow.postMessage({ action: 'navigate_back' }, '*');
      return true;
    }
    return false;
  }

  // 1. Dengarkan pesan dari iframe
  window.addEventListener('message', function(event) {
    if (!event.data || typeof event.data !== 'object') return;

    if (event.data.action === 'request_exit') {
      // GAS sudah di beranda → minta keluar dari aplikasi
      console.log('🚪 GAS minta exit, mundur keluar aplikasi');
      try {
        // Kalau ada history dummy, pop dulu; kalau tidak, langsung back
        window.history.back();
      } catch (e) {}
    }

    if (event.data.action === 'back_handled') {
      // GAS berhasil handle back (opsional, untuk log)
      console.log('↩️ GAS handle back');
    }
  });

  // 2. Expose fungsi global agar Android bisa panggil via JS interface
  //    (Android akan panggil: webView.evaluateJavascript("window.AndroidBack()"))
  window.AndroidBack = function() {
    var ok = kirimNavigateBackKeIframe();
    if (!ok) {
      // Iframe belum siap → langsung back
      try { window.history.back(); } catch (e) {}
    }
  };

  // 3. Fallback: kalau wrapper dibuka di browser biasa (bukan WebView),
  //    tetap bisa tangkap back via popstate
  window.addEventListener('load', function() {
    history.pushState({ view: 'main' }, '', '');

    window.addEventListener('popstate', function() {
      var ok = kirimNavigateBackKeIframe();
      // Selalu push state lagi agar back berikutnya tetap tertangkap
      history.pushState({ view: 'main' }, '', '');

      if (!ok) {
        // Iframe belum siap, biarkan browser handle
        history.back();
      }
    });
  });
</script>
</body>
</html>
