<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Judul aplikasi -->
    <title>Aplikasi Penagihan TP Saluampak</title>

    <!-- Meta tags agar tampil full screen seperti aplikasi native saat di Add to Home Screen -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Penagihan TP Saluampak">
    <meta name="apple-mobile-web-app-title" content="Penagihan TP Saluampak">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#a60000"> <!-- Warna tema (sesuai warna merah aplikasi Anda) -->

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            height: 100dvh; 
            overflow: hidden; 
            background-color: #f7f7f7; 
        }

        .iframe-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .iframe-cutter {
            position: absolute;
            width: 100%;
            height: 100%; 
            top: -5px; 
            overflow: hidden; 
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%; 
            border: none;
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <div class="iframe-cutter">
            <iframe src="https://script.google.com/macros/s/AKfycbzf7AvZP5RTnxuWmL-jBsCLsug0Db3XUwe_bXtXnCQGd8OhAfMqVZtIE9GfrE0udV-9Ig/exec"></iframe>
        </div>
    </div>
</body>
</html>
