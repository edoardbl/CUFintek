<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplikasi Koperasi / Penagihan</title>
    <style>
        /* Memaksa halaman utama GitHub benar-benar bersih dan pas di layar */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Menghilangkan scrollbar pada pembungkus luar */
            background-color: #f5f5f5; /* Sesuaikan warna latar jika diperlukan */
        }
        
        /* Mengatur iframe agar memenuhi layar secara absolut */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Masukkan URL Google Apps Script Anda di sini -->
    <iframe src="https://script.google.com/macros/s/AKfycbxj9vAYtG4fI9R9S94WrTzbxYGbsk81-0LB0gmkol5bMPgIKRQagutcrVGMck0dNPnRqQ/exec"></iframe>

</body>
</html>
