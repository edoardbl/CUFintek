<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Saya</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Mencegah scroll ganda */
        }
        .iframe-container {
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            /* Tambah tinggi dan geser ke atas untuk menyembunyikan banner Google */
            height: calc(100vh + 40px); 
            margin-top: -40px; 
            border: none;
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <!-- Ganti src dengan link web app Google Apps Script Anda yang baru dideploy -->
        <iframe src="https://script.google.com/macros/s/AKfycbzD5XwX6JOMkx7cTNpaXIpARh2fvEANxgWXjuE0LMy6p8m9Ij2NA_utxYZ7tcdxOcbNdw/exec"></iframe>
    </div>
</body>
</html>
