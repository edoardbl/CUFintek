<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplikasi Saya</title>
    
    <!-- Sembunyikan URL asli dari preview link (WhatsApp, Telegram, dll) -->
    <meta property="og:title" content="Aplikasi Penagihan">
    <meta property="og:description" content="Membuat tugas penagihan menjadi lebih praktis">
    <meta property="og:url" content="https://edoardbl.github.io/CUFintek/">
    
    <!-- Cegah indexing Google -->
    <meta name="robots" content="noindex, nofollow">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        /* Container untuk iframe */
        #app-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Iframe dengan margin negatif untuk memotong banner Google */
        #app-frame {
            width: 100%;
            height: calc(100% + 60px); /* tambah tinggi untuk kompensasi margin */
            border: 0;
            margin-top: -60px;          /* ← KUNCI: potong banner Google */
            display: block;
        }
        
        /* Loading screen */
        #loader {
            position: fixed;
            inset: 0;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }
        
        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top-color: #4285f4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loader-text {
            margin-top: 16px;
            color: #666;
            font-size: 14px;
        }
        
        /* Fallback kalau iframe diblokir */
        #fallback {
            display: none;
            position: fixed;
            inset: 0;
            background: #fff;
            padding: 40px 20px;
            text-align: center;
            z-index: 10000;
        }
        
        #fallback.show { display: block; }
        
        #fallback h2 { color: #333; margin-bottom: 16px; }
        #fallback a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #4285f4;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">Memuat aplikasi...</div>
    </div>

    <!-- Container utama -->
    <div id="app-container">
        <iframe 
            id="app-frame"
            src="https://script.google.com/macros/s/AKfycbyiB_9vTEqMZnpVKjbiQgn1oZg3kD3QI-J5Vaj29-F6oboxFk8LdgyR7xpXiN3U0JCnIQ/exec"
            allow="clipboard-read; clipboard-write; camera; microphone; geolocation"
            referrerpolicy="no-referrer"
            loading="eager">
        </iframe>
    </div>

    <!-- Fallback kalau iframe gagal -->
    <div id="fallback">
        <h2>⚠️ Tidak dapat memuat aplikasi</h2>
        <p>Aplikasi tidak bisa ditampilkan di sini.</p>
        <a href="https://script.google.com/macros/s/AKfycby_uxSt0lX6rJixIdABazRHiN6dvL7UOD5jXj5y4H-A0PaIHNVOp9JOCcp7t1taz19LgQ/exec" 
           target="_blank" rel="noopener">
            Buka Aplikasi di Tab Baru
        </a>
    </div>

    <script>
        (function() {
            const iframe   = document.getElementById('app-frame');
            const loader   = document.getElementById('loader');
            const fallback = document.getElementById('fallback');
            let loaded = false;
            
            // Sembunyikan loader setelah iframe dimuat
            iframe.addEventListener('load', function() {
                loaded = true;
                setTimeout(() => loader.classList.add('hidden'), 300);
            });
            
            // Timeout: kalau 12 detik belum load, tampilkan fallback
            setTimeout(function() {
                if (!loaded) {
                    loader.classList.add('hidden');
                    fallback.classList.add('show');
                }
            }, 12000);
            
            // Deteksi kalau iframe diblokir (X-Frame-Options)
            // Trik: coba akses contentWindow — kalau error berarti diblokir
            setTimeout(function() {
                try {
                    const test = iframe.contentWindow.location.href;
                    // Kalau bisa diakses tanpa error, iframe jalan (tapi tetap cross-origin)
                } catch (e) {
                    // Normal untuk cross-origin, abaikan
                }
            }, 2000);
            
            // Cegah zoom di mobile
            document.addEventListener('gesturestart', e => e.preventDefault());
            document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
        })();
    </script>

</body>
</html>
