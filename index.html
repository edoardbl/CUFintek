<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aplikasi Penagihan TP Saluampak</title>
    
    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Aplikasi Penagihan TP Saluampak" />
    <link rel="manifest" href="site.webmanifest" />
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Penagihan TP Saluampak">
    <meta name="apple-mobile-web-app-title" content="Penagihan TP Saluampak">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#a60000">

    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; height: 100dvh;
            overflow: hidden; background-color: #f7f7f7; 
        }
        .iframe-container { position: relative; width: 100%; height: 100%; overflow: hidden; }
        .iframe-cutter { position: absolute; width: 100%; height: 100%; top: -5px; overflow: hidden; }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div class="iframe-container">
        <div class="iframe-cutter">
            <iframe 
                id="appIframe"
                src="https://script.google.com/macros/s/AKfycbw-7pCHlZIcmnTqzP2ShVYCI9FotF8NT004sKechbt7LMqbF0O-v-mQOyh5PcD-MtmAXg/exec"
                allow="geolocation *">
            </iframe>
        </div>
    </div>
<script>
    // Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('/CUFintek/sw.js')
                .then(function(registration) { console.log('SW didaftarkan:', registration.scope); })
                .catch(function(error) { console.log('SW gagal:', error); });
        });
    }

    // ⭐ MENDENGARKAN PESAN DARI IFRAME (REFRESH BERSIH)
    window.addEventListener('message', function(event) {
        if (event.data && event.data.action === 'force_reload_from_iframe') {
            console.log('📩 Menerima perintah reload dari iframe...');
            
            // ⭐ CARA 1: Reload iframe langsung (paling cepat & aman)
            try {
                var iframe = document.getElementById('appIframe');
                if (iframe && iframe.contentWindow) {
                    // Reload konten iframe
                    iframe.contentWindow.location.reload();
                    console.log('✅ Reload iframe via contentWindow');
                }
            } catch (e) {
                console.warn('⚠️ Reload iframe gagal (cross-origin):', e.message);
            }
            
            // ⭐ CARA 2: Kalau Cara 1 gagal → reload iframe via src (dengan cache-bust)
            setTimeout(function() {
                try {
                    var iframe2 = document.getElementById('appIframe');
                    if (iframe2) {
                        var baseSrc = iframe2.src.split('?')[0];
                        iframe2.src = baseSrc + '?v=' + new Date().getTime();
                        console.log('✅ Reload iframe via src');
                    }
                } catch (e) {
                    console.warn('⚠️ Reload iframe via src gagal:', e.message);
                }
            }, 500);
            
            // ⭐ CARA 3: Last resort → reload seluruh halaman (kalau iframe masih nyangkut)
            setTimeout(function() {
                // Cek apakah iframe masih menampilkan overlay maroon
                // (tidak bisa akses cross-origin, jadi pakai heuristic waktu)
                console.log('🔄 Fallback: reload seluruh halaman...');
                window.location.reload();
            }, 3000);
        }
    });
</script>
</body>
</html>
