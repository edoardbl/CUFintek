<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aplikasi Penagihan TP Saluampak</title>
    
    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Aplikasi Penagihan TP Saluampak" />
    <link rel="manifest" href="site.webmanifest" />
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Penagihan TP Saluampak">
    <meta name="apple-mobile-web-app-title" content="Penagihan TP Saluampak">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#a60000">

    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; height: 100dvh;
            overflow: hidden; background-color: #f7f7f7; 
        }
        .iframe-container { position: relative; width: 100%; height: 100%; overflow: hidden; }
        .iframe-cutter { position: absolute; width: 100%; height: 100%; top: -5px; overflow: hidden; }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div class="iframe-container">
        <div class="iframe-cutter">
            <iframe 
                id="appIframe"
                src="https://script.google.com/macros/s/AKfycby0RMiG2rnD-7sOm4QaJ2VpHSYkvgcX_BzHQ-kb51YokoQW1P2BmElBLsksPsAsvWO-7A/exec"
                allow="geolocation *">
            </iframe>
        </div>
    </div>
<script>
    // Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('/CUFintek/sw.js')
                .then(function(reg) { console.log('SW didaftarkan:', reg.scope); })
                .catch(function(err) { console.log('SW gagal:', err); });
        });
    }

    // ⭐ Loading overlay untuk parent — muncul saat iframe reload
    var _reloadSudahJalan = false;

    function tampilkanLoadingParent() {
        if (document.getElementById('parentLoadingOverlay')) return;

        var ov = document.createElement('div');
        ov.id = 'parentLoadingOverlay';
        ov.style.cssText = 
            'position:fixed;top:0;left:0;right:0;bottom:0;' +
            'background:linear-gradient(135deg,#8B0000,#A31515);' +
            'z-index:999999;display:flex;flex-direction:column;' +
            'align-items:center;justify-content:center;' +
            'color:white;font-family:sans-serif;text-align:center;padding:20px;';
        ov.innerHTML = 
            '<div style="width:60px;height:60px;border:5px solid rgba(255,215,0,0.3);' +
            'border-top-color:#FFD700;border-radius:50%;' +
            'animation:spin 0.8s linear infinite;margin-bottom:20px;"></div>' +
            '<div style="font-size:16px;font-weight:bold;margin-bottom:8px;">Memuat Ulang Aplikasi...</div>' +
            '<div style="font-size:13px;opacity:0.85;max-width:300px;line-height:1.5;">' +
            'Cache sudah dibersihkan. Mohon tunggu sebentar.</div>';

        // Keyframe spin
        if (!document.getElementById('spinStyleParent')) {
            var s = document.createElement('style');
            s.id = 'spinStyleParent';
            s.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
            document.head.appendChild(s);
        }

        document.body.appendChild(ov);
    }

    function sembunyikanLoadingParent() {
        var ov = document.getElementById('parentLoadingOverlay');
        if (ov) ov.remove();
    }

    // ⭐ LISTENER PESAN DARI IFRAME
    window.addEventListener('message', function(event) {
        if (event.data && event.data.action === 'force_reload_from_iframe') {
            
            // ⭐ Cegah double reload
            if (_reloadSudahJalan) {
                console.log('⏭️ Reload sudah jalan, skip');
                return;
            }
            _reloadSudahJalan = true;
            
            console.log('📩 Reload iframe dimulai...');
            
            // Tampilkan loading
            tampilkanLoadingParent();
            
            var iframe = document.getElementById('appIframe');
            if (!iframe) {
                window.location.reload();
                return;
            }
            
            // ⭐ Strategi: ubah src dengan cache-bust
            var baseSrc = iframe.src.split('?')[0];
            var newSrc = baseSrc + '?v=' + new Date().getTime();
            
            // Reset flag setelah 30 detik (jaga-jaga kalau load gagal)
            setTimeout(function() {
                _reloadSudahJalan = false;
            }, 30000);
            
            iframe.src = newSrc;
            console.log('✅ Iframe reload:', newSrc);

            // ⭐ Sembunyikan loading saat iframe selesai load
            iframe.addEventListener('load', function onLoad() {
                console.log('✅ Iframe selesai load');
                setTimeout(sembunyikanLoadingParent, 300);
                iframe.removeEventListener('load', onLoad);
            });

            // ⭐ WATCHDOG: Kalau 15 detik iframe belum load → coba reload halaman
            setTimeout(function() {
                if (document.getElementById('parentLoadingOverlay')) {
                    console.warn('⚠️ Iframe lambat load, fallback reload halaman...');
                    window.location.reload();
                }
            }, 15000);
        }
    });

    // ⭐ Sembunyikan loading parent saat halaman selesai load pertama kali
    window.addEventListener('load', function() {
        setTimeout(sembunyikanLoadingParent, 300);
    });
</script>
</body>
</html>
