  <script>
    (function ensureStandaloneGlobals() {
      if (!window.AppUI) {
        window.AppUI = {
          toast: function (msg) {
            var el = document.getElementById('cufToastStandalone');
            if (!el) return;
            el.textContent = String(msg || '');
            el.style.display = 'block';
            clearTimeout(window.__cufToastTimer);
            window.__cufToastTimer = setTimeout(function () {
              el.style.display = 'none';
            }, 2800);
          }
        };
      }
      if (!window.AppCore) {
        window.AppCore = {
          getUser: function () {
            try {
              var keys = Object.keys(localStorage);
              for (var i = 0; i < keys.length; i++) {
                if (keys[i].toLowerCase().indexOf('user') !== -1) {
                  var parsed = JSON.parse(localStorage.getItem(keys[i]) || 'null');
                  if (parsed && (parsed.nama || parsed.username)) {
                    return parsed;
                  }
                }
              }
            } catch (e) {}
            return { username: '', nama: '', level: '' };
          }
        };
      }
      if (!window.AppAPI) {
        window.AppAPI = {
          call: async function () {
            throw new Error('Mode offline: server belum dapat dihubungi');
          }
        };
      }
    })();
  </script>

  // =========================================================================
  // OFFLINE-FIRST ENGINE: INDEXEDDB CACHE + ANTREAN SIMPAN KUNJUNGAN
  // =========================================================================
  const KUNJ_CACHE_PREFIX = 'cufintek_kunj_cache_v1_';
  const KUNJ_IDB_NAME = 'cufintek_kunjungan_idb_v1';
  const KUNJ_STORE_SNAP = 'snapshots';
  const KUNJ_STORE_QUEUE = 'kunj_queue';
  let _kunjIdbPromise = null;
  let _kunjSyncRunning = false;
  let _kunjOfflineListenersAttached = false;
  let _kunjQueueCountCache = 0;

  const isNetworkLikeError = (err) => {
    const msg = String((err && err.message) || err || '').toLowerCase();
    if (typeof navigator !== 'undefined' && !navigator.onLine) return true;
    return (
      msg.includes('network') ||
      msg.includes('failed to fetch') ||
      msg.includes('timeout') ||
      msg.includes('timed out') ||
      msg.includes('offline') ||
      msg.includes('load failed') ||
      msg.includes('disconnect') ||
      msg.includes('internet') ||
      msg.includes('aborted') ||
      msg.includes('unreachable')
    );
  };

  const openKunjunganIDB = () => {
    if (_kunjIdbPromise) return _kunjIdbPromise;
    if (typeof indexedDB === 'undefined') return Promise.resolve(null);
    _kunjIdbPromise = new Promise((resolve) => {
      try {
        const req = indexedDB.open(KUNJ_IDB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(KUNJ_STORE_SNAP)) {
            db.createObjectStore(KUNJ_STORE_SNAP, { keyPath: 'key' });
          }
          if (!db.objectStoreNames.contains(KUNJ_STORE_QUEUE)) {
            db.createObjectStore(KUNJ_STORE_QUEUE, { keyPath: 'id' });
          }
        };
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = () => resolve(null);
      } catch (err) {
        resolve(null);
      }
    });
    return _kunjIdbPromise;
  };

  const saveKunjSnapshot = async (key, payload) => {
    try {
      localStorage.setItem(key, JSON.stringify({ savedAt: Date.now(), payload }));
    } catch (e) {}
    try {
      const db = await openKunjunganIDB();
      if (!db) return;
      await new Promise((resolve) => {
        const tx = db.transaction(KUNJ_STORE_SNAP, 'readwrite');
        tx.objectStore(KUNJ_STORE_SNAP).put({ key, savedAt: Date.now(), payload });
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      });
    } catch (e) {}
  };

  const readKunjSnapshot = async (key) => {
    try {
      const raw = localStorage.getItem(key);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.payload) return parsed;
      }
    } catch (e) {}
    try {
      const db = await openKunjunganIDB();
      if (!db) return null;
      return await new Promise((resolve) => {
        const tx = db.transaction(KUNJ_STORE_SNAP, 'readonly');
        const req = tx.objectStore(KUNJ_STORE_SNAP).get(key);
        req.onsuccess = () => {
          const val = req.result;
          resolve(val && val.payload ? val : null);
        };
        req.onerror = () => resolve(null);
      });
    } catch (e) {
      return null;
    }
  };

  const readKunjQueue = async () => {
    try {
      const db = await openKunjunganIDB();
      if (db) {
        const list = await new Promise((resolve) => {
          const tx = db.transaction(KUNJ_STORE_QUEUE, 'readonly');
          const req = tx.objectStore(KUNJ_STORE_QUEUE).getAll();
          req.onsuccess = () => resolve(Array.isArray(req.result) ? req.result : []);
          req.onerror = () => resolve([]);
        });
        list.sort((a, b) => (Number(a.createdAt) || 0) - (Number(b.createdAt) || 0));
        _kunjQueueCountCache = list.length;
        return list;
      }
    } catch (e) {}
    try {
      const raw = localStorage.getItem(KUNJ_CACHE_PREFIX + 'queue_fallback');
      const arr = raw ? JSON.parse(raw) : [];
      _kunjQueueCountCache = Array.isArray(arr) ? arr.length : 0;
      return Array.isArray(arr) ? arr : [];
    } catch (e) {
      return [];
    }
  };

  const enqueueKunjunganOffline = async (payload, metaLabel = '') => {
    const clientId = 'kunj_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    const enrichedPayload = Object.assign({}, payload, {
      clientId: clientId,
      queuedAt: new Date().toISOString()
    });
    const record = {
      id: clientId,
      action: 'simpanKunjunganTerpadu',
      payload: enrichedPayload,
      metaLabel: metaLabel || `${payload.nama || '-'} (${payload.kategori || 'PINJAMAN'})`,
      createdAt: Date.now(),
      attempts: 0,
      lastError: ''
    };

    let savedToIdb = false;
    try {
      const db = await openKunjunganIDB();
      if (db) {
        savedToIdb = await new Promise((resolve) => {
          const tx = db.transaction(KUNJ_STORE_QUEUE, 'readwrite');
          tx.objectStore(KUNJ_STORE_QUEUE).put(record);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      }
    } catch (e) {}

    if (!savedToIdb) {
      try {
        const cur = await readKunjQueue();
        cur.push(record);
        localStorage.setItem(KUNJ_CACHE_PREFIX + 'queue_fallback', JSON.stringify(cur));
      } catch (e) {}
    }

    await updateKunjOfflineBannerUI();
    return clientId;
  };

  const removeKunjQueueItem = async (id) => {

    try {
      const raw = localStorage.getItem(KUNJ_CACHE_PREFIX + 'queue_fallback');

  const flushKunjunganOfflineQueue = async (silent = false) => {
    if (_kunjSyncRunning) return;
    if (typeof navigator !== 'undefined' && !navigator.onLine) {
      if (!silent && typeof AppUI !== 'undefined' && AppUI.toast) {
        AppUI.toast('Belum ada sinyal internet untuk menyinkronkan kunjungan.', 'warning');

      return;

    const q = await readKunjQueue();
    if (q.length === 0) {
      await updateKunjOfflineBannerUI();
      return;
    }

    _kunjSyncRunning = true;
    await updateKunjOfflineBannerUI();

    let berhasil = 0;
    for (let i = 0; i < q.length; i++) {
      const item = q[i];
      try {
        const res = await AppAPI.call(item.action || 'simpanKunjunganTerpadu', item.payload);
        if (res && res.sukses) {
          berhasil++;
          await removeKunjQueueItem(item.id);
        } else {
          item.attempts = (Number(item.attempts) || 0) + 1;
          item.lastError = (res && res.error) || 'Gagal diproses server';
          await updateKunjQueueItem(item);
        }
      } catch (err) {
        item.attempts = (Number(item.attempts) || 0) + 1;
        item.lastError = err.message || 'Gangguan jaringan';
        await updateKunjQueueItem(item);
        if ((typeof navigator !== 'undefined' && !navigator.onLine) || isNetworkLikeError(err)) {
          break;
        }
      }
    }

    _kunjSyncRunning = false;
    await updateKunjOfflineBannerUI();

    if (berhasil > 0) {
      muatRingkasanHariIni();

  // Cari anggota langsung dari cache lokal ViewTagihan (localStorage / IndexedDB) saat offline
  const cariAnggotaDariCacheLokal = async (keyword, mode = 'SINGLE', excludeCif = '') => {
    const q = String(keyword || '').trim().toLowerCase();
    if (!q) return mode === 'LIST' ? [] : null;

    const u = getUserInfo();
    const kandidatKeys = [
      `cufintek_tagihan_cache_v1_daftar_${String(u.level || '').trim().toLowerCase()}_${String(u.username || 'guest').trim().toLowerCase()}_${String(u.namaPetugas || '').trim().toLowerCase()}`,
      `cufintek_tagihan_cache_v1_daftar_${String(u.level || '').trim().toLowerCase()}__${String(u.namaPetugas || '').trim().toLowerCase()}`
    ];

    let allList = [];
    for (let k of kandidatKeys) {
      try {
        const raw = localStorage.getItem(k);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.payload && Array.isArray(parsed.payload.list)) {
            allList = parsed.payload.list;
            break;
          }
        }
      } catch (e) {}
    }

    // Jika belum ketemu di exact key, pindai seluruh key cache tagihan di localStorage
    if (allList.length === 0) {
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const lsKey = localStorage.key(i) || '';
          if (lsKey.startsWith('cufintek_tagihan_cache_v1_daftar_')) {
            const parsed = JSON.parse(localStorage.getItem(lsKey) || '{}');
            if (parsed && parsed.payload && Array.isArray(parsed.payload.list) && parsed.payload.list.length > 0) {
              allList = parsed.payload.list;
              break;
            }
          }
        }
      } catch (e) {}
    }

    // Fallback baca dari IndexedDB cufintek_tagihan_idb_v1 jika localStorage kosong
    if (allList.length === 0 && typeof indexedDB !== 'undefined') {
      allList = await new Promise((resolve) => {
        try {
          const req = indexedDB.open('cufintek_tagihan_idb_v1', 1);
          req.onsuccess = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('snapshots')) { resolve([]); return; }
            const tx = db.transaction('snapshots', 'readonly');
            const getAllReq = tx.objectStore('snapshots').getAll();
            getAllReq.onsuccess = () => {
              const rows = getAllReq.result || [];
              const found = rows.find(r => String(r.key || '').startsWith('cufintek_tagihan_cache_v1_daftar_') && r.payload && Array.isArray(r.payload.list));
              resolve(found ? found.payload.list : []);
            };
            getAllReq.onerror = () => resolve([]);
          };
          req.onerror = () => resolve([]);
        } catch (err) {
          resolve([]);
        }
      });
    }

    if (!Array.isArray(allList) || allList.length === 0) {
      return mode === 'LIST' ? [] : null;
    }

    const norm = (v) => String(v || '').trim().toLowerCase();
    const normNum = (v) => String(v || '').replace(/[^0-9]/g, '');
    const qNum = normNum(q);

    if (mode === 'SINGLE') {
      // Prioritaskan kecocokan persis pada No. Rekening atau CIF, lalu kecocokan nama/parsial
      let exact = allList.find(item => {
        const cif = norm(item.cif);
        const rek = norm(item.noRek);
        return cif === q || rek === q || (qNum && (normNum(item.cif) === qNum || normNum(item.noRek) === qNum));
      });
      if (!exact) {
        exact = allList.find(item =>
          norm(item.cif).includes(q) ||
          norm(item.noRek).includes(q) ||
          norm(item.nama).includes(q) ||
          norm(item.panggilan).includes(q)
        );
      }
      if (!exact) return null;
      return {
        cif: exact.cif || '-',
        noRek: exact.noRek || '-',
        nama: exact.nama || '-',
        panggilan: exact.panggilan || '',
        desa: exact.desa || '',
        kategori: exact.kategori || state.kategori || 'PINJAMAN',
        nominalUtama: Number(exact.nominalUtama ?? exact.tagihanNormal ?? exact.totalTagihan ?? 0),
        nominalProgram: Number(exact.nominalProgram ?? exact.tagihanProgram ?? 0),
        fromOfflineCache: true
      };
    }

    // Mode LIST untuk pencarian Anggota Lain 1 Rumah / Rombongan
    const exCif = norm(excludeCif);
    const matches = [];
    const seen = new Set();
    for (let i = 0; i < allList.length; i++) {
      const item = allList[i];
      const cif = norm(item.cif);
      if (exCif && cif === exCif) continue;
      const hay = `${norm(item.nama)} ${norm(item.panggilan)} ${cif} ${norm(item.noRek)} ${norm(item.desa)}`;
      if (hay.includes(q)) {
        const uniq = `${item.cif || ''}_${item.kategori || ''}_${item.noRek || ''}`;
        if (seen.has(uniq)) continue;
        seen.add(uniq);
        matches.push({
          cif: item.cif || '-',
          noRek: item.noRek || '-',
          nama: item.nama || '-',
          panggilan: item.panggilan || '',
          kategori: item.kategori || 'PINJAMAN',
          subBadge: item.subBadge || item.kategori || 'Anggota',
          nominalUtama: Number(item.nominalUtama ?? item.tagihanNormal ?? item.totalTagihan ?? 0)
        });
        if (matches.length >= 15) break;
      }
    }
    return matches;
  };

  const render = async (targetContainer, prefillParam = null) => {
    const container = (typeof targetContainer === 'string')
      ? document.getElementById(targetContainer)
      : (targetContainer || document.getElementById('app-content'));
    if (!container) return;

    const incoming = prefillParam || window.__KUNJUNGAN_PREFILL__ || null;
    window.__KUNJUNGAN_PREFILL__ = null;

      if (val === 'Dibonceng Rekan') {
        inp.value = 'Dibonceng ';
        inp.focus();
        state.transportasi = inp.value;
      } else {
        inp.value = val;
      }

    document.querySelectorAll('#gridTransportasiKunjungan .kunj-status-btn').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-transport') === val);
    });
  };

  const onInputTransportasi = (val) => {
    state.transportasi = String(val || '');
    const low = state.transportasi.trim().toLowerCase();
    document.querySelectorAll('#gridTransportasiKunjungan .kunj-status-btn').forEach(btn => {
      const optVal = String(btn.getAttribute('data-transport') || '').toLowerCase();
      const match = optVal === low || (optVal === 'dibonceng rekan' && low.startsWith('dibonceng'));
      btn.classList.toggle('active', match);
    });
  };

  // =========================================================================
  // CHIP RESPON ANGGOTA (OPSIONAL / SATU KETUK)
  // =========================================================================
  const toggleResponAnggota = (id) => {
    state.selectedRespon = (state.selectedRespon === id) ? '' : id;
    renderChipResponAnggota();
  };

  const renderChipResponAnggota = () => {
    const wrap = document.getElementById('wrapChipResponAnggota');
    const grid = document.getElementById('gridChipResponAnggota');
    const descBox = document.getElementById('boxDescResponAnggota');
    const badge = document.getElementById('lblResponTerpilihBadge');
    if (!wrap || !grid) return;

    // Otomatis sembunyikan pada status Tidak Ditemui (kecuali skenario titip pesan keluarga/tetangga)
    const isTitipPesan = /titip|keluarga|tetangga/i.test(state.selectedSkenario || '');
    const hideWrap = (state.statusKunjungan === 'Tidak Ditemui' && !isTitipPesan);

    if (hideWrap) {
      wrap.style.display = 'none';
      state.selectedRespon = '';
      return;
    }

    wrap.style.display = 'block';

    grid.innerHTML = RESPON_ANGGOTA_OPTIONS.map(opt => {
      const active = state.selectedRespon === opt.id;
      const cls = `respon-chip-btn${active ? ' active' : ''}${active && opt.danger ? ' is-danger' : ''}`;
      return `
        <button type="button" class="${cls}" onclick="ViewKunjungan.toggleResponAnggota('${opt.id}')">
          <span>${opt.icon}</span>
          <span>${opt.label}</span>
        </button>
      `;
    }).join('');

    const terpilih = RESPON_ANGGOTA_OPTIONS.find(o => o.id === state.selectedRespon);
    if (badge) {
      badge.textContent = terpilih ? `✓ ${terpilih.label}` : '';
    }
    if (descBox) {
      if (terpilih) {
        descBox.style.display = 'block';
        descBox.innerHTML = `<strong>${terpilih.icon} ${terpilih.label}:</strong> ${terpilih.desc}`;
      } else {
        descBox.style.display = 'none';
        descBox.innerHTML = '';
      }
    }
  };

  // =========================================================================
  // ANGGOTA LAIN 1 RUMAH / ROMBONGAN (OPSI B: STATUS & NOMINAL PER ANGGOTA)
  // =========================================================================
  const fokusCariRombongan = () => {
    document.getElementById('inputCariRombongan')?.focus();
  };

  const onKetikCariRombongan = (val) => {
    clearTimeout(_timerCariRombongan);
    const dd = document.getElementById('ddRombonganHasil');
    const q = String(val || '').trim();

    if (q.length < 2) {
      if (dd) {
        dd.innerHTML = '';
        dd.classList.remove('is-open');
      }
      return;
    }

    if (dd) {
      dd.innerHTML = '<div style="padding:10px 12px; font-size:12px; color:#d97706;">⏳ Mencari nama / panggilan / CIF...</div>';
      dd.classList.add('is-open');
    }

    _timerCariRombongan = setTimeout(async () => {
      const excludeCif = state.selectedMember?.cif || '';
      if (typeof navigator !== 'undefined' && !navigator.onLine) {

          const lokalList = await cariAnggotaDariCacheLokal(q, 'LIST', excludeCif);

          renderDropdownRombongan(lokalList);
          return;

  const initSignaturePad = () => {
    const canvas = document.getElementById('canvasTtdAnggota');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = '#111827';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    let drawing = false;

    const getPos = (e) => {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    };

    const startDraw = (e) => {
      if (e.cancelable) e.preventDefault();
      drawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    };

    const moveDraw = (e) => {
      if (!drawing) return;
      if (e.cancelable) e.preventDefault();
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      if (!state.hasSigned) {
        state.hasSigned = true;
        const lbl = document.getElementById('lblStatusTtd');
        if (lbl) {
          lbl.textContent = '✅ TTD baru terekam';
          lbl.style.color = '#10b981';
        }
      }
    };

    const endDraw = () => {
      if (!drawing) return;
      drawing = false;
      ctx.closePath();
    };

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', moveDraw);
    window.addEventListener('mouseup', endDraw);

    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', moveDraw, { passive: false });
    canvas.addEventListener('touchend', endDraw);
  };

  // =========================================================================
  // PARSER CERDAS TANGGAL JANJI BAYAR & KUNJUNGAN ULANG DI FRONTEND
  // =========================================================================
  const parseJadwalDariCatatanClient = (teks) => {
    const txt = String(teks || '').trim();
    if (!txt) return { janji: '', kunjUlang: '' };

    const now = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const toIso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    const bulanMap = {
      jan: 1, januari: 1, feb: 2, februari: 2, mar: 3, maret: 3,
      apr: 4, april: 4, mei: 5, jun: 6, juni: 6, jul: 7, juli: 7,
      agu: 8, agt: 8, agustus: 8, sep: 9, september: 9, okt: 10, oktober: 10,
      nov: 11, november: 11, des: 12, desember: 12
    };

    const parseSeg = (seg) => {
      const s = String(seg || '').toLowerCase();
      let m = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;

      m = s.match(/(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/);
      if (m) {
        const dd = parseInt(m[1], 10);
        const mm = parseInt(m[2], 10);
        let yy = m[3] ? parseInt(m[3], 10) : now.getFullYear();
        if (yy < 100) yy += 2000;
        if (dd >= 1 && dd <= 31 && mm >= 1 && mm <= 12) return `${yy}-${pad(mm)}-${pad(dd)}`;
      }

      m = s.match(/(\d{1,2})\s+(januari|jan|februari|feb|maret|mar|april|apr|mei|juni|jun|juli|jul|agustus|agu|agt|september|sep|oktober|okt|november|nov|desember|des)(?:\s+(\d{2,4}))?/i);
      if (m) {
        const dd = parseInt(m[1], 10);
        const mm = bulanMap[m[2].toLowerCase()] || (now.getMonth() + 1);
        let yy = m[3] ? parseInt(m[3], 10) : now.getFullYear();
        if (yy < 100) yy += 2000;
        return `${yy}-${pad(mm)}-${pad(dd)}`;
      }

      m = s.match(/(?:tgl|tanggal)\.?\s*(\d{1,2})(?:\s+(bulan\s+depan|bln\s+depan))?/i);
      if (m) {
        const dd = parseInt(m[1], 10);
        if (dd >= 1 && dd <= 31) {
          let yy = now.getFullYear();
          let mm = now.getMonth() + 1;
          if (m[2] || dd < now.getDate()) {
            mm += 1;
            if (mm > 12) { mm = 1; yy += 1; }
          }
          return `${yy}-${pad(mm)}-${pad(dd)}`;
        }
      }

      if (/besok/.test(s)) { const d = new Date(now); d.setDate(d.getDate() + 1); return toIso(d); }
      if (/lusa/.test(s)) { const d = new Date(now); d.setDate(d.getDate() + 2); return toIso(d); }
      if (/minggu\s+depan/.test(s)) { const d = new Date(now); d.setDate(d.getDate() + 7); return toIso(d); }
      if (/akhir\s+bulan/.test(s)) { const d = new Date(now.getFullYear(), now.getMonth() + 1, 0); return toIso(d); }
      return '';
    };

    let janji = '';
    let kunjUlang = '';

    const mKU = txt.match(/(?:kunjungan\s+ulang|dikunjungi\s+(?:lagi|ulang|kembali)|cek\s+(?:ulang|kembali)|kunjungi\s+lagi)[^.;\n]*/i);
    if (mKU) kunjUlang = parseSeg(mKU[0]);

    const mJB = txt.match(/(?:janji(?:\s+bayar)?|akan\s+(?:bayar|transfer|setor)|bayar\s+(?:tgl|tanggal|besok|lusa|minggu|akhir)|menyusul)[^.;\n]*/i);
    if (mJB) janji = parseSeg(mJB[0]);

    if (!janji && !kunjUlang) {
      const umum = parseSeg(txt);
      if (umum) {
        if (state.statusKunjungan === 'Tidak Ditemui') kunjUlang = umum;
        else janji = umum;
      }
    }
    return { janji, kunjUlang };
  };

    const user = getUserInfo();
    const namaAktif = String(user.namaPetugas || '').trim();
    const hasil = Array.isArray(arrTim) ? arrTim.slice() : [];
    if (!namaAktif) return hasil;

    const matchDb = state.daftarPetugas.find(p => p.toLowerCase() === namaAktif.toLowerCase());
    const namaFinal = matchDb || namaAktif;

    if (!hasil.some(x => x.toLowerCase() === namaFinal.toLowerCase())) {
      hasil.unshift(namaFinal);

    return hasil;

  const bukaModalTim = async () => {

    if (state.daftarPetugas.length === 0) {

      if (snapPetugas && Array.isArray(snapPetugas.payload)) {

    }

    state.timPetugas = pastikanUserAktifDiTim(state.timPetugas);
    state.tempTimPetugas = state.timPetugas.slice();

    const modal = document.createElement('div');
    modal.id = 'modalPilihTimKunjungan';
    modal.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:9999; display:flex; align-items:center; justify-content:center; padding:16px;';
    modal.onclick = (e) => { if (e.target === modal) modal.remove(); };

    modal.innerHTML = `
      <div onclick="event.stopPropagation()" style="background:var(--kj-card-bg); color:var(--kj-text-main); border:1px solid var(--kj-border); width:100%; max-width:430px; border-radius:14px; overflow:hidden; display:flex; flex-direction:column; max-height:85vh; box-shadow:0 12px 28px rgba(0,0,0,0.35);">
        <div style="background:linear-gradient(135deg,#8B0000,#5C0000); color:#fff; padding:14px 16px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-weight:800; color:#FFD700; font-size:15px;">Pilih Petugas Penagihan Tim</div>
            <div style="font-size:11px; opacity:0.9;">Anda sudah otomatis terpilih — ketuk rekan tim lain yang ikut</div>
          </div>
          <button type="button" onclick="document.getElementById('modalPilihTimKunjungan').remove()"
            style="background:none; border:none; color:#FFD700; font-size:18px; font-weight:700; cursor:pointer;">✕</button>
        </div>

        <div style="padding:10px; border-bottom:1px solid var(--kj-border);">
          <input type="text" id="searchModalTimKunj" placeholder="🔍 Ketik nama petugas pendamping..."
            oninput="ViewKunjungan.renderListKapsulTim(this.value)"
            class="kunj-input" style="border:2px solid var(--kj-gold); font-size:13px;">
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:8px 10px; border-bottom:1px solid var(--kj-border);">
          <button type="button" onclick="ViewKunjungan.pilihSemuaTimModal()"
            style="background:#8B0000; color:#FFD700; border:none; padding:8px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer;">
            ✓ Pilih Semua
          </button>
          <button type="button" onclick="ViewKunjungan.kosongkanTimModal()"
            style="background:var(--kj-soft-cream-bg); color:var(--kj-text-main); border:1px solid var(--kj-border-strong); padding:8px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer;">
            ✗ Reset Rekan Tim
          </button>
        </div>

        <div id="wadahChipsModalTim" style="display:flex; flex-wrap:wrap; gap:8px; padding:14px; overflow-y:auto; flex:1; align-content:flex-start;"></div>

        <div style="padding:12px; border-top:1px solid var(--kj-border); background:var(--kj-soft-cream-bg); display:flex; gap:8px;">
          <button type="button" onclick="ViewKunjungan.terapkanTim()"
            style="flex:1; background:#8B0000; color:#FFD700; border:none; padding:11px; border-radius:10px; font-size:13px; font-weight:800; cursor:pointer;">
            Terapkan Petugas Tim (${state.tempTimPetugas.length})
          </button>
        </div>
      </div>
    `;

    document.body.appendChild(modal);
    renderListKapsulTim('');
  };

  const renderListKapsulTim = (keyword = '') => {
    const wadah = document.getElementById('wadahChipsModalTim');
    if (!wadah) return;

    const userAktif = String(getUserInfo().namaPetugas || '').trim().toLowerCase();
    const q = keyword.toLowerCase().trim();
    const list = state.daftarPetugas.filter(p => !q || p.toLowerCase().includes(q));

    const fullList = list.slice();
    if (!q && userAktif && !fullList.some(p => p.toLowerCase() === userAktif)) {
      const namaUser = String(getUserInfo().namaPetugas || '').trim();
      if (namaUser) fullList.unshift(namaUser);
    }

    if (fullList.length === 0) {
      wadah.innerHTML = '<div style="font-size:12px; color:var(--kj-text-muted); width:100%; text-align:center; padding:16px;">Nama petugas tidak ditemukan.</div>';
      return;
    }

    wadah.innerHTML = fullList.map(nama => {
      const isUserSendiri = userAktif && nama.toLowerCase() === userAktif;
      const terpilih = state.tempTimPetugas.some(x => x.toLowerCase() === nama.toLowerCase());
      const safeNama = nama.replace(/'/g, "\\'");
      return `
        <button type="button" onclick="ViewKunjungan.toggleKapsulTim('${safeNama}')"
          style="padding:7px 12px; border-radius:999px; font-size:12px; font-weight:700; cursor:pointer; transition:0.15s;
          border:1.5px solid ${terpilih ? '#8B0000' : 'var(--kj-border-strong)'};
          background:${terpilih ? '#8B0000' : 'var(--kj-surface-bg)'};
          color:${terpilih ? '#FFD700' : 'var(--kj-text-sub)'};">
          ${terpilih ? '✓ ' : '+ '}${nama}${isUserSendiri ? ' (Anda)' : ''}
        </button>
      `;
    }).join('');
  };

  const toggleKapsulTim = (nama) => {
    const userAktif = String(getUserInfo().namaPetugas || '').trim().toLowerCase();
    if (userAktif && nama.toLowerCase() === userAktif) {
      AppUI.toast('Anda adalah petugas aktif yang menginput kunjungan ini.', 'info');
      return;
    }
    const idx = state.tempTimPetugas.findIndex(x => x.toLowerCase() === nama.toLowerCase());
    if (idx >= 0) state.tempTimPetugas.splice(idx, 1);
    else state.tempTimPetugas.push(nama);

    const btnTerapkan = document.querySelector('#modalPilihTimKunjungan button[onclick="ViewKunjungan.terapkanTim()"]');
    if (btnTerapkan) btnTerapkan.textContent = `Terapkan Petugas Tim (${state.tempTimPetugas.length})`;

    const q = document.getElementById('searchModalTimKunj')?.value || '';
    renderListKapsulTim(q);
  };

  const pilihSemuaTimModal = () => {
    state.tempTimPetugas = pastikanUserAktifDiTim(state.daftarPetugas.slice());
    const btnTerapkan = document.querySelector('#modalPilihTimKunjungan button[onclick="ViewKunjungan.terapkanTim()"]');
    if (btnTerapkan) btnTerapkan.textContent = `Terapkan Petugas Tim (${state.tempTimPetugas.length})`;
    const q = document.getElementById('searchModalTimKunj')?.value || '';
    renderListKapsulTim(q);
  };

  const kosongkanTimModal = () => {
    state.tempTimPetugas = pastikanUserAktifDiTim([]);
    const btnTerapkan = document.querySelector('#modalPilihTimKunjungan button[onclick="ViewKunjungan.terapkanTim()"]');
    if (btnTerapkan) btnTerapkan.textContent = `Terapkan Petugas Tim (${state.tempTimPetugas.length})`;
    const q = document.getElementById('searchModalTimKunj')?.value || '';
    renderListKapsulTim(q);
  };

  const terapkanTim = () => {
    state.timPetugas = pastikanUserAktifDiTim(state.tempTimPetugas);
    document.getElementById('modalPilihTimKunjungan')?.remove();
    renderRingkasanTimTerpilih();
  };

  const hapusSatuAnggotaTim = (nama) => {
    const userAktif = String(getUserInfo().namaPetugas || '').trim().toLowerCase();
    if (userAktif && nama.toLowerCase() === userAktif) {
      AppUI.toast('Nama Anda tidak bisa dihapus dari tim.', 'warning');
      return;
    }
    state.timPetugas = state.timPetugas.filter(x => x.toLowerCase() !== nama.toLowerCase());
    renderRingkasanTimTerpilih();
  };

  const renderRingkasanTimTerpilih = () => {
    const lbl = document.getElementById('lblJumlahTim');
    const chipsBox = document.getElementById('chipsTimTerpilih');
    if (lbl) lbl.textContent = `👥 Anggota Tim (${state.timPetugas.length} orang)`;
    if (!chipsBox) return;

    const userAktif = String(getUserInfo().namaPetugas || '').trim().toLowerCase();

    if (state.timPetugas.length === 0) {
      chipsBox.innerHTML = '<span style="font-size:11px; color:var(--kj-text-muted);">Belum ada petugas dipilih.</span>';
      return;
    }

    chipsBox.innerHTML = state.timPetugas.map(nama => {
      const isUserSendiri = userAktif && nama.toLowerCase() === userAktif;
      const safeNama = nama.replace(/'/g, "\\'");
      return `
        <span style="display:inline-flex; align-items:center; gap:5px; background:#8B0000; color:#FFD700; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:700;">
          ${nama}${isUserSendiri ? ' (Anda)' : ''}
          ${!isUserSendiri ? `<span onclick="ViewKunjungan.hapusSatuAnggotaTim('${safeNama}')" style="cursor:pointer; font-weight:900;">✕</span>` : ''}
        </span>
      `;
    }).join('');
  };

  // =========================================================================
  // STATUS KUNJUNGAN & SKENARIO CATATAN LAPANGAN KONTEKSTUAL
  // =========================================================================
  const setStatusKunjungan = (statusVal) => {
    state.statusKunjungan = statusVal;
    state.selectedSkenario = '';

    document.querySelectorAll('#gridStatusKunjungan .kunj-status-btn').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-status') === statusVal);
    });

    const wrapTgl = document.getElementById('wrapTglJanjiKunj');
    const lblTgl = document.getElementById('lblTglJanjiKunj');
    const wrapNom = document.getElementById('wrapNominalKunj');

    if (wrapTgl) {
      const showTgl = (statusVal === 'Janji Bayar' || statusVal === 'Belum Bayar' || statusVal === 'Bayar Sebagian');
      wrapTgl.style.display = showTgl ? 'block' : 'none';
      if (lblTgl) {
        lblTgl.innerHTML = statusVal === 'Janji Bayar'
          ? 'Tanggal Janji Bayar <span>*</span>'
          : 'Tanggal Janji Bayar (Opsional / Otomatis dari Catatan)';
      }
    }

    if (wrapNom) {
      const hideNom = (statusVal === 'Tidak Ditemui' || statusVal === 'Belum Bayar');
      wrapNom.style.display = hideNom ? 'none' : 'block';
    }

    renderDropdownSkenario(statusVal);
    renderChipResponAnggota();
    onInputCatatanChange();
  };

  const renderDropdownSkenario = (statusVal) => {
    const menu = document.getElementById('menuKunjSkenario');
    const lbl = document.getElementById('lblKunjSkenarioTerpilih');
    const baseList = state.skenarioMap[statusVal] || [];
    const listSkenario = baseList.filter(s => s !== CUSTOM_SKENARIO_LABEL);

    if (lbl) {
      lbl.textContent = state.selectedSkenario
        ? state.selectedSkenario
        : `-- Pilih skenario kondisi (${statusVal}) --`;
    }
    if (!menu) return;

    const opsiResetHtml = `
      <div class="kunj-dd-opt ${!state.selectedSkenario ? 'is-selected' : ''}"
        onclick="ViewKunjungan.pilihSkenarioByIdx(-1)">
        <span style="opacity:0.85;">-- Kosongkan pilihan skenario --</span>
        ${!state.selectedSkenario ? '<span>✓</span>' : ''}
      </div>
    `;

    const opsiListHtml = listSkenario.map((s, idx) => {
      const isSel = state.selectedSkenario === s;
      return `
        <div class="kunj-dd-opt ${isSel ? 'is-selected' : ''}"
          onclick="ViewKunjungan.pilihSkenarioByIdx(${idx})">
          <span style="flex:1; white-space:normal; word-break:break-word;">${s}</span>
          ${isSel ? '<span style="flex-shrink:0;">✓</span>' : ''}
        </div>
      `;
    }).join('');

    const opsiCustomHtml = `
      <div class="kunj-dd-opt is-custom-opt ${state.selectedSkenario === CUSTOM_SKENARIO_LABEL ? 'is-selected' : ''}"
        onclick="ViewKunjungan.pilihSkenarioCustom()">
        <span style="flex:1;">${CUSTOM_SKENARIO_LABEL}</span>
        ${state.selectedSkenario === CUSTOM_SKENARIO_LABEL ? '<span>✓</span>' : ''}
      </div>
    `;

    menu.innerHTML = opsiResetHtml + opsiListHtml + opsiCustomHtml;
  };

  const pilihSkenarioByIdx = (idx) => {
    const baseList = (state.skenarioMap[state.statusKunjungan] || []).filter(s => s !== CUSTOM_SKENARIO_LABEL);
    const teksSkenario = idx >= 0 ? (baseList[idx] || '') : '';
    state.selectedSkenario = teksSkenario;

    document.getElementById('ddKunjSkenarioWrap')?.classList.remove('is-open');
    renderDropdownSkenario(state.statusKunjungan);
    renderChipResponAnggota();

    if (!teksSkenario) return;
    const txtArea = document.getElementById('kunjCatatanInput');
    if (!txtArea) return;

    const current = txtArea.value.trim();
    if (!current) {
      txtArea.value = teksSkenario;
    } else if (!current.includes(teksSkenario)) {
      txtArea.value = teksSkenario + '. ' + current;
    }
    onInputCatatanChange();
  };

  const pilihSkenarioCustom = () => {
    state.selectedSkenario = CUSTOM_SKENARIO_LABEL;
    document.getElementById('ddKunjSkenarioWrap')?.classList.remove('is-open');
    renderDropdownSkenario(state.statusKunjungan);
    renderChipResponAnggota();

    const txtArea = document.getElementById('kunjCatatanInput');
    if (txtArea) {
      txtArea.focus();
    }
  };

  const muatKonfigurasiSkenario = async () => {
    try {
      const snapKonfig = await readKunjSnapshot(KUNJ_CACHE_PREFIX + 'konfig_skenario');
      if (snapKonfig && snapKonfig.payload) {
        if (snapKonfig.payload.identitas) state.identitas = snapKonfig.payload.identitas;
        if (snapKonfig.payload.skenarioMap) {
          state.skenarioMap = Object.assign({}, DEFAULT_SKENARIO_MAP, snapKonfig.payload.skenarioMap);
          renderDropdownSkenario(state.statusKunjungan);
        }
      }
      if (typeof navigator !== 'undefined' && !navigator.onLine) return;
      const res = await AppAPI.call('getKonfigurasiCatatanKunjungan', {});
      if (res && res.sukses) {
        if (res.identitas) state.identitas = res.identitas;
        if (res.skenarioMap) {
          state.skenarioMap = Object.assign({}, DEFAULT_SKENARIO_MAP, res.skenarioMap);
          renderDropdownSkenario(state.statusKunjungan);
        }
        saveKunjSnapshot(KUNJ_CACHE_PREFIX + 'konfig_skenario', {
          identitas: state.identitas,
          skenarioMap: res.skenarioMap || state.skenarioMap
        });
      }
    } catch (e) {}
  };

  const setKategori = (kat) => {
    state.kategori = kat === 'NON_TAGIHAN' ? 'PINJAMAN' : kat;
    ['PINJAMAN', 'SW', 'KLPK'].forEach(k => {
      document.getElementById('btnKat' + k)?.classList.toggle('active', state.kategori === k);
    });
    if (state.selectedMember) {
      state.selectedMember.kategori = state.kategori;
      renderMemberBox();
    }
  };

  const terapkanDataAnggota = (m) => {
    state.selectedMember = m;
    state.rombonganList = state.rombonganList.filter(x => x.cif !== m.cif);
    renderKartuRombongan();

    const inpCari = document.getElementById('kunjInputCari');
    if (inpCari) {
      inpCari.value = (m.noRek && m.noRek !== '-') ? m.noRek : m.cif;
    }

    const quickNomBox = document.getElementById('wrapQuickNominalChips');
    const nomUtama = Number(m.nominalUtama) || 0;
    const nomProg = Number(m.nominalProgram) || 0;

    if (nomUtama > 0) {
      setNominalUtama(nomUtama);
    } else {
      setNominalUtama(0);
    }

    if (quickNomBox) {
      const chips = [];
      if (nomUtama > 0) {
        chips.push(`<button type="button" class="kunj-quick-chip" onclick="ViewKunjungan.setNominalUtama(${nomUtama})">Tagihan Normal: ${rp(nomUtama)}</button>`);
      }
      if (nomProg > 0 && nomProg !== nomUtama) {
        chips.push(`<button type="button" class="kunj-quick-chip" onclick="ViewKunjungan.setNominalUtama(${nomProg})">Program: ${rp(nomProg)}</button>`);
      }
      quickNomBox.innerHTML = chips.join('');
    }

    if (m.savedTtd && m.savedTtd.ttdUrl) {
      state.savedTtd = m.savedTtd;
      state.modeTtdBaru = false;
      renderStateTtd();
    } else if (m.cif) {
      muatArsipTtdAnggota(m.cif);
    }

    renderMemberBox();
  };

  const renderMemberBox = () => {
    const box = document.getElementById('kunjMemberPreview');
    if (!box) return;
    const m = state.selectedMember;
    if (!m) {
      box.innerHTML = '';
      return;
    }

    const targetSheet = state.kategori === 'KLPK'
      ? '03_PenangananKLPK'
      : (state.kategori === 'SW' ? '20_RiwayatPenangananSW' : '11_Penanganan');

    box.innerHTML = `
      <div class="kunj-member-box">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
          <div style="min-width:0;">
            <div style="font-weight:800; font-size:14px; color:var(--kj-text-main); word-break:break-word;">
              ${m.nama} ${m.panggilan ? `<span style="color:#d97706;">(${m.panggilan})</span>` : ''}
            </div>
            <div style="font-size:11px; color:var(--kj-text-muted); margin-top:2px;">
              CIF: <strong>${m.cif}</strong> • Rek: <strong>${m.noRek || '-'}</strong> ${m.desa ? '• ' + m.desa : ''}
            </div>
          </div>
          <span style="background:#8B0000; color:#FFD700; padding:3px 8px; border-radius:6px; font-size:10px; font-weight:800; flex-shrink:0; white-space:nowrap;">
            ${state.kategori}
          </span>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; gap:6px; flex-wrap:wrap; margin-top:8px; padding-top:8px; border-top:1px dashed var(--kj-border-strong); font-size:12px;">
          <span>Tagihan: <strong style="color:#d97706;">${rp(m.nominalUtama)}</strong></span>
          <span style="font-size:11px; color:var(--kj-text-muted);">Target DB: <strong>${targetSheet}</strong></span>
        </div>
      </div>
    `;
  };

  const cariAnggota = async () => {
    const keyword = (document.getElementById('kunjInputCari')?.value || '').trim();
    if (!keyword) {
      AppUI.toast('Masukkan No. Rekening atau CIF terlebih dahulu.', 'warning');
      return;
    }

    const btn = document.getElementById('btnCariAnggotaKunj');
    if (btn) { btn.disabled = true; btn.textContent = '...'; }

    try {
      if (typeof navigator !== 'undefined' && !navigator.onLine) {
        const lokalAnggota = await cariAnggotaDariCacheLokal(keyword, 'SINGLE');
        if (lokalAnggota) {
          if (lokalAnggota.kategori && lokalAnggota.kategori !== 'NON_TAGIHAN') {
            setKategori(lokalAnggota.kategori);
          }
          terapkanDataAnggota(lokalAnggota);
          AppUI.toast('📡 Data anggota dimuat dari cache offline: ' + lokalAnggota.nama, 'info');
        } else {
          AppUI.toast('Mode Offline: anggota tidak ada di cache lokal. Anda tetap bisa mengisi input secara manual.', 'warning');
        }
        return;
      }

      const res = await AppAPI.call('cariAnggotaTerpaduKunjungan', {
        keyword: keyword,
        kategoriPreferensi: state.kategori
      });

      if (!res || !res.sukses || !res.anggota) {
        const lokalAnggota = await cariAnggotaDariCacheLokal(keyword, 'SINGLE');
        if (lokalAnggota) {
          if (lokalAnggota.kategori && lokalAnggota.kategori !== 'NON_TAGIHAN') {
            setKategori(lokalAnggota.kategori);
          }
          terapkanDataAnggota(lokalAnggota);
          AppUI.toast('📡 Data anggota dimuat dari cache offline: ' + lokalAnggota.nama, 'info');
          return;
        }
        AppUI.toast(res?.error || 'Anggota tidak ditemukan di Pinjaman, SW, maupun KLPK.', 'warning');
        return;
      }

      if (res.anggota.kategori && res.anggota.kategori !== 'NON_TAGIHAN') {
        setKategori(res.anggota.kategori);
      }
      terapkanDataAnggota(res.anggota);
      AppUI.toast('Data anggota ditemukan: ' + res.anggota.nama, 'success');
    } catch (e) {
      const lokalAnggota = await cariAnggotaDariCacheLokal(keyword, 'SINGLE');
      if (lokalAnggota) {
        if (lokalAnggota.kategori && lokalAnggota.kategori !== 'NON_TAGIHAN') {
          setKategori(lokalAnggota.kategori);
        }
        terapkanDataAnggota(lokalAnggota);
        AppUI.toast('📡 Sinyal lemah: data anggota dimuat dari cache offline (' + lokalAnggota.nama + ').', 'info');
        return;
      }
      AppUI.toast('Gagal mencari anggota: ' + e.message, 'error');
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = 'Cari'; }
    }
  };

  // =========================================================================
  // AUTO-GPS SAAT BUKA MENU + TOMBOL UPDATE LOKASI GPS
  // =========================================================================
  const ambilGPS = (silent = false) => {
    const lbl = document.getElementById('lblGpsKunj');
    const sub = document.getElementById('gpsStatusSub');
    if (!navigator.geolocation) {
      if (!silent) AppUI.toast('Browser tidak mendukung GPS.', 'warning');
      if (sub) sub.textContent = '⚠️ Perangkat tidak mendukung GPS.';
      return;
    }
    if (lbl) lbl.textContent = 'Update Lokasi GPS';
    if (sub) sub.textContent = '🟡 Mengunci titik lokasi GPS...';

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        state.lat = pos.coords.latitude.toFixed(6);
        state.lng = pos.coords.longitude.toFixed(6);
        const akurasi = Math.round(pos.coords.accuracy || 0);
        if (lbl) lbl.textContent = 'Update Lokasi GPS';
        if (sub) sub.innerHTML = `<span style="color:#10b981; font-weight:700;">🟢 GPS Terkunci: ${state.lat}, ${state.lng}</span> (±${akurasi}m)`;
        if (!silent) AppUI.toast('Lokasi GPS berhasil diperbarui.', 'success');
      },
      () => {
        if (lbl) lbl.textContent = 'Update Lokasi GPS';
        if (sub) sub.innerHTML = `<span style="color:#f59e0b;">⚠️ GPS belum terkunci — ketuk "Update Lokasi GPS"</span>`;
        if (!silent) AppUI.toast('Tidak dapat mengambil titik lokasi GPS. Pastikan izin lokasi aktif.', 'warning');
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 15000 }
    );
  };

  // =========================================================================
  // FOTO BUKTI (KAMERA LANGSUNG / GALERI HP) DENGAN WATERMARK OTOMATIS
  // =========================================================================
  const handleFoto = (input, sumber = 'kamera') => {
    const file = input.files && input.files[0];
    if (!file) return;

    const statusFotoEl = document.getElementById('statusFotoWatermark');
    const lblKamera = document.getElementById('lblFotoKamera');
    const lblGaleri = document.getElementById('lblFotoGaleri');

    if (statusFotoEl) {
      statusFotoEl.innerHTML = '⏳ Memproses foto & menambahkan watermark...';
    }

    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxW = 900;
        const scale = img.width > maxW ? maxW / img.width : 1;
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);

        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        const now = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        const waktuStr = `${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

        const user = getUserInfo();
        const m = state.selectedMember || {};
        const inputId = (document.getElementById('kunjInputCari')?.value || '').trim();
        const ekstraRomb = state.rombonganList.length > 0 ? ` + ${state.rombonganList.length} anggota 1 rumah` : '';
        const namaAnggota = (m.nama ? `${m.nama} (${m.cif || inputId})` : (inputId || 'Anggota')) + ekstraRomb;
        const gpsStr = (state.lat && state.lng) ? `${state.lat}, ${state.lng}` : 'GPS belum dikunci';

        const bannerH = Math.max(66, Math.round(canvas.width * 0.11));
        const yTop = canvas.height - bannerH;
        const fontTitle = Math.max(12, Math.round(canvas.width * 0.019));
        const fontSub = Math.max(10, Math.round(canvas.width * 0.0155));
        const padX = Math.max(12, Math.round(canvas.width * 0.02));

        ctx.fillStyle = 'rgba(28, 0, 0, 0.80)';
        ctx.fillRect(0, yTop, canvas.width, bannerH);

        ctx.fillStyle = '#FFD700';
        ctx.fillRect(0, yTop, canvas.width, 3);

        ctx.font = `700 ${fontTitle}px sans-serif`;
        ctx.fillStyle = '#FFD700';
        const headerLembaga = `${state.identitas.koperasi} • ${state.identitas.namaTP} [${state.kategori}]`;
        ctx.fillText(headerLembaga, padX, yTop + Math.round(bannerH * 0.34));

        ctx.font = `600 ${fontSub}px sans-serif`;
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(`Anggota: ${namaAnggota} • Status: ${state.statusKunjungan}`, padX, yTop + Math.round(bannerH * 0.63));

        ctx.font = `${fontSub}px sans-serif`;
        ctx.fillStyle = '#E5E7EB';
        ctx.fillText(`${waktuStr} WITA • Petugas: ${user.namaPetugas || '-'} • GPS: ${gpsStr}`, padX, yTop + Math.round(bannerH * 0.89));

        state.fotoBase64 = canvas.toDataURL('image/jpeg', 0.80);

        if (lblKamera) lblKamera.textContent = sumber === 'kamera' ? 'Kamera ✓' : 'Kamera';
        if (lblGaleri) lblGaleri.textContent = sumber === 'galeri' ? 'Dari Galeri ✓' : 'Dari Galeri';
        if (statusFotoEl) {
          const asalTeks = sumber === 'galeri' ? 'Galeri HP' : 'Kamera Langsung';
          statusFotoEl.innerHTML = `<span style="color:#10b981; font-weight:700;">✅ Foto (${asalTeks}) siap & sudah diberi watermark</span>`;
        }

        const prev = document.getElementById('previewFotoKunjSatuPintu');
        if (prev) {
          prev.innerHTML = `
            <div style="position:relative; margin-top:8px;">
              <img src="${state.fotoBase64}" style="width:100%; max-height:195px; object-fit:cover; border-radius:10px; border:1.5px solid #8B0000; display:block;">
              <button type="button" onclick="ViewKunjungan.hapusFoto()"
                style="position:absolute; top:8px; right:8px; background:rgba(139,0,0,0.9); color:#FFD700; border:1px solid #FFD700; border-radius:8px; padding:4px 9px; font-size:11px; font-weight:800; cursor:pointer;">
                🗑️ Hapus Foto
              </button>
            </div>
          `;
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  };

  const hapusFoto = () => {
    state.fotoBase64 = '';
    const inpKam = document.getElementById('inputFotoKamera');
    const inpGal = document.getElementById('inputFotoGaleri');
    if (inpKam) inpKam.value = '';
    if (inpGal) inpGal.value = '';

    const lblKam = document.getElementById('lblFotoKamera');
    const lblGal = document.getElementById('lblFotoGaleri');
    if (lblKam) lblKam.textContent = 'Kamera';
    if (lblGal) lblGal.textContent = 'Dari Galeri';

    const statusFotoEl = document.getElementById('statusFotoWatermark');
    if (statusFotoEl) statusFotoEl.innerHTML = '';

    const prev = document.getElementById('previewFotoKunjSatuPintu');
    if (prev) prev.innerHTML = '';
  };

  const resetForm = () => {
    state.selectedMember = null;
    state.timPetugas = [];
    state.rombonganList = [];
    state.hasilCariRombongan = [];
    state.savedTtd = null;
    state.modeTtdBaru = true;
    state.detectedJanji = '';
    state.detectedKunjUlang = '';
    state.selectedSkenario = '';
    state.selectedRespon = '';
    let lastTrans = state.transportasi || 'Motor Pribadi';
    try {
      lastTrans = localStorage.getItem('CU_LAST_TRANSPORTASI') || lastTrans;
    } catch (eLs) {}
    state.jenisPenagihan = 'INDIVIDU';
    state.transportasi = lastTrans;
    document.getElementById('btnTypeIndividu')?.classList.add('active');
    document.getElementById('btnTypeTim')?.classList.remove('active');
    const barTim = document.getElementById('barTimTerpilih');
    if (barTim) barTim.style.display = 'none';
    document.getElementById('formKunjunganSatuPintu')?.reset();
    onInputTransportasi(lastTrans);
    const inpTransReset = document.getElementById('kunjTransportasiInput');
    if (inpTransReset) inpTransReset.value = lastTrans;
    renderMemberBox();
    renderKartuRombongan();
    renderRingkasanTimTerpilih();
    hapusTtd();
    renderStateTtd();
    hapusFoto();
    setStatusKunjungan('Bayar Tunai');

    const badgeDet = document.getElementById('badgeDeteksiCatatan');
    if (badgeDet) badgeDet.style.display = 'none';
    const quickNom = document.getElementById('wrapQuickNominalChips');
    if (quickNom) quickNom.innerHTML = '';

    ambilGPS(true);
  };

  const submitForm = async (e) => {
    e.preventDefault();
    const inputId = (document.getElementById('kunjInputCari')?.value || '').trim();
    if (!inputId) {
      AppUI.toast('No. Rekening / CIF wajib diisi.', 'warning');
      return;
    }

    const transportasiVal = (document.getElementById('kunjTransportasiInput')?.value || state.transportasi || 'Motor Pribadi').trim();
    if (!transportasiVal) {
      AppUI.toast('Moda transportasi kunjungan wajib diisi.', 'warning');
      return;
    }

    const catatanRaw = (document.getElementById('kunjCatatanInput')?.value || '').trim();
    const det = parseJadwalDariCatatanClient(catatanRaw);
    const tglJanjiInput = document.getElementById('kunjTanggalJanji')?.value || det.janji || '';

    if (state.statusKunjungan === 'Janji Bayar' && !tglJanjiInput) {
      AppUI.toast('Tanggal Janji Bayar wajib diisi (atau ketik tgl janji di catatan).', 'warning');
      return;
    }

    for (let i = 0; i < state.rombonganList.length; i++) {
      const rItem = state.rombonganList[i];
      if (rItem.status === 'Janji Bayar' && !rItem.tanggalJanji && !det.janji) {
        AppUI.toast(`Tanggal Janji Bayar wajib diisi untuk anggota rombongan: ${rItem.nama}`, 'warning');
        return;
      }
    }

    if (state.hasSigned) {
      const canvasTtd = document.getElementById('canvasTtdAnggota');
      if (canvasTtd) state.ttdBase64 = canvasTtd.toDataURL('image/png');
    } else {
      state.ttdBase64 = '';
    }

    const existingTtdUrl = (!state.hasSigned && state.savedTtd && state.savedTtd.ttdUrl)
      ? state.savedTtd.ttdUrl
      : '';

    const user = getUserInfo();
    const m = state.selectedMember || {};
    const daftarTimKirim = state.jenisPenagihan === 'TIM'
      ? pastikanUserAktifDiTim(state.timPetugas)
      : [];

    if (state.jenisPenagihan === 'TIM' && daftarTimKirim.length < 2) {
      AppUI.toast('Penagihan Tim minimal terdiri dari 2 petugas. Tambahkan rekan tim terlebih dahulu.', 'warning');
      await bukaModalTim();
      return;
    }

    try { localStorage.setItem('CU_LAST_TRANSPORTASI', transportasiVal); } catch (eLs) {}

    const btn = document.getElementById('btnSimpanKunjSatuPintu');
    const totalAnggotaSimpan = 1 + state.rombonganList.length;
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = `<i class="ph ph-spinner ph-spin"></i> Menyimpan${totalAnggotaSimpan > 1 ? ` (1/${totalAnggotaSimpan})` : ''}...`;
    }

    try {
      const jenisKunj = state.jenisPenagihan === 'TIM' ? 'Penagihan Tim' : 'Kunjungan Lapangan';
      const namaUtama = m.nama || ('Anggota ' + inputId);
      const nominalUtamaAngka = parseRibuan(document.getElementById('kunjNominalInput')?.value);
      const responObj = RESPON_ANGGOTA_OPTIONS.find(o => o.id === state.selectedRespon);
      const responLabel = responObj ? responObj.fullText : '';

      const infoResponTag = responLabel ? ` [Respon: ${responLabel}]` : '';
      const infoRombonganUtama = state.rombonganList.length > 0
        ? ` [1 Rumah bersama: ${state.rombonganList.map(x => x.nama).join(', ')}]`
        : '';

      const payloadUtama = {
        kategori: state.kategori,
        cif: m.cif || inputId,
        noRek: (m.noRek && m.noRek !== '-') ? m.noRek : inputId,
        nama: namaUtama,
        jenis: jenisKunj,
        transportasi: transportasiVal,
        hasil: state.statusKunjungan,
        responAnggota: responLabel,
        tanggalJanji: tglJanjiInput,
        tanggalKunjunganUlang: det.kunjUlang || '',
        nominalJanji: nominalUtamaAngka,
        catatan: (catatanRaw + infoResponTag + infoRombonganUtama).trim(),
        petugas: user.namaPetugas || 'Petugas',
        timPetugas: daftarTimKirim,
        fotoBase64: state.fotoBase64,
        ttdBase64: state.ttdBase64,
        existingTtdUrl: existingTtdUrl,
        lat: state.lat,
        lng: state.lng
      };

      const buildPayloadRombongan = (rItem, ttdArsipAnggota = '') => {
        const catatanRombongan = `${catatanRaw ? catatanRaw + ' ' : ''}${responLabel ? `[Respon: ${responLabel}] ` : ''}[Kunjungan 1 Rumah bersama ${namaUtama}]`.trim();
        return {
          kategori: rItem.kategori || 'PINJAMAN',
          cif: rItem.cif || '-',
          noRek: (rItem.noRek && rItem.noRek !== '-') ? rItem.noRek : (rItem.cif || '-'),
          nama: rItem.nama,
          jenis: jenisKunj,
          transportasi: transportasiVal,
          hasil: rItem.status || state.statusKunjungan,
          responAnggota: responLabel,
          tanggalJanji: rItem.tanggalJanji || det.janji || '',
          tanggalKunjunganUlang: det.kunjUlang || '',
          nominalJanji: parseRibuan(rItem.nominal),
          catatan: catatanRombongan,
          petugas: user.namaPetugas || 'Petugas',
          timPetugas: daftarTimKirim,
          fotoBase64: state.fotoBase64,
          ttdBase64: '',
          existingTtdUrl: ttdArsipAnggota,
          lat: state.lat,
          lng: state.lng
        };
      };

      const antrekanSemuaOffline = async (mulaiDariRombonganIdx = -1) => {
        let jmlAntre = 0;
        if (mulaiDariRombonganIdx < 0) {
          await enqueueKunjunganOffline(payloadUtama, `${namaUtama} (${state.kategori})`);
          jmlAntre++;
        }
        const startIdx = Math.max(0, mulaiDariRombonganIdx);
        for (let k = startIdx; k < state.rombonganList.length; k++) {
          const rItem = state.rombonganList[k];
          let cachedTtdUrl = '';
          if (rItem.cif && rItem.cif !== '-') {
            const snapTtd = await readKunjSnapshot(`${KUNJ_CACHE_PREFIX}ttd_${rItem.cif}`);
            if (snapTtd && snapTtd.payload && snapTtd.payload.ttdUrl) {
              cachedTtdUrl = snapTtd.payload.ttdUrl;
            }
          }
          const pRomb = buildPayloadRombongan(rItem, cachedTtdUrl);
          await enqueueKunjunganOffline(pRomb, `${rItem.nama} (1 Rumah)`);
          jmlAntre++;
        }
        return jmlAntre;
      };

      // Jalur 1: Perangkat sedang Offline (mati sinyal)
      if (typeof navigator !== 'undefined' && !navigator.onLine) {
        const jml = await antrekanSemuaOffline(-1);
        AppUI.toast(`📡 Mode Offline: ${jml} data kunjungan (termasuk Foto & TTD) disimpan di HP dan otomatis dikirim saat sinyal kembali.`, 'info');
        resetForm();
        muatRingkasanHariIni();
        return;
      }

      // Jalur 2: Online (dengan fallback otomatis ke antrean offline jika sinyal tiba-tiba putus)
      let res = null;
      try {
        res = await AppAPI.call('simpanKunjunganTerpadu', payloadUtama);
      } catch (errUtama) {
        if (isNetworkLikeError(errUtama)) {
          const jml = await antrekanSemuaOffline(-1);
          AppUI.toast(`📡 Sinyal terputus saat mengirim: ${jml} data kunjungan disimpan ke antrean offline HP.`, 'info');
          resetForm();
          muatRingkasanHariIni();
          return;
        }
        throw errUtama;
      }

      if (!res || !res.sukses) {
        AppUI.toast('Gagal menyimpan anggota utama: ' + (res?.error || 'Error server'), 'error');
        return;
      }

      let suksesTambahan = 0;
      let antreTambahan = 0;
      const gagalTambahan = [];

      for (let i = 0; i < state.rombonganList.length; i++) {
        const rItem = state.rombonganList[i];
        if (btn) {
          btn.innerHTML = `<i class="ph ph-spinner ph-spin"></i> Menyimpan (${i + 2}/${totalAnggotaSimpan})...`;
        }

        let ttdArsipAnggota = '';
        if (rItem.cif && rItem.cif !== '-') {
          const snapTtd = await readKunjSnapshot(`${KUNJ_CACHE_PREFIX}ttd_${rItem.cif}`);
          if (snapTtd && snapTtd.payload && snapTtd.payload.ttdUrl) {
            ttdArsipAnggota = snapTtd.payload.ttdUrl;
          } else {
            try {
              const resTtd = await AppAPI.call('getArsipTTDAnggota', { cif: rItem.cif });
              if (resTtd && resTtd.sukses && resTtd.found && resTtd.ttdUrl) {
                ttdArsipAnggota = resTtd.ttdUrl;
                saveKunjSnapshot(`${KUNJ_CACHE_PREFIX}ttd_${rItem.cif}`, resTtd);
              }
            } catch (eTtd) {}
          }
        }

        const payloadRomb = buildPayloadRombongan(rItem, ttdArsipAnggota);

        try {
          const resRomb = await AppAPI.call('simpanKunjunganTerpadu', payloadRomb);
          if (resRomb && resRomb.sukses) suksesTambahan++;
          else gagalTambahan.push(rItem.nama);
        } catch (errRomb) {
          if (isNetworkLikeError(errRomb)) {
            antreTambahan += await antrekanSemuaOffline(i);
            break;
          }
          gagalTambahan.push(rItem.nama);
        }
      }

      let infoExtra = '';
      if (res.detectedJanji) infoExtra += ` • Janji: ${res.detectedJanji}`;
      if (res.detectedKunjUlang) infoExtra += ` • Kunj. Ulang: ${res.detectedKunjUlang}`;
      if (suksesTambahan > 0) infoExtra += ` • +${suksesTambahan} anggota 1 rumah tersimpan`;
      if (antreTambahan > 0) infoExtra += ` • +${antreTambahan} masuk antrean offline`;

      if (gagalTambahan.length > 0) {
        AppUI.toast(`Tersimpan sebagian. Gagal pada: ${gagalTambahan.join(', ')}`, 'warning');
      } else {
        AppUI.toast('Tersimpan ke ' + res.target + infoExtra, 'success');
      }

      resetForm();
      muatRingkasanHariIni();
    } catch (err) {
      AppUI.toast('Error koneksi: ' + err.message, 'error');
    } finally {
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="ph ph-floppy-disk"></i> Simpan Data'; }
    }
  };

  const muatRingkasanHariIni = async () => {
    const user = getUserInfo();
    const todayIso = new Date().toISOString().slice(0, 10);
    const snapKey = `${KUNJ_CACHE_PREFIX}ringkasan_${todayIso}_${String(user.namaPetugas || '').trim().toLowerCase()}`;

    const terapkanRingkasanDenganAntrean = async (baseStats) => {
      const q = await readKunjQueue();
      let addTotal = 0;
      let addNom = 0;
      let addBayar = 0;
      let addJanji = 0;
      let addBelum = 0;

      q.forEach(item => {
        const p = item.payload || {};
        addTotal++;
        addNom += Number(p.nominalJanji) || 0;
        const h = String(p.hasil || '');
        if (h.includes('Bayar Tunai') || h.includes('Transfer')) addBayar++;
        else if (h.includes('Janji')) addJanji++;
        else addBelum++;
      });

      const setTxt = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
      const totKunj = (Number(baseStats.totalKunjungan) || 0) + addTotal;
      setTxt('sumTotalKunj', addTotal > 0 ? `${totKunj} (${addTotal} offline)` : totKunj);
      setTxt('sumTotalNominal', rp((Number(baseStats.totalNominal) || 0) + addNom));
      setTxt('sumBayar', (Number(baseStats.bayar) || 0) + addBayar);
      setTxt('sumJanji', (Number(baseStats.janji) || 0) + addJanji);
      setTxt('sumBelum', (Number(baseStats.belum) || 0) + addBelum);
    };

    const snapLama = await readKunjSnapshot(snapKey);
    if (snapLama && snapLama.payload) {
      await terapkanRingkasanDenganAntrean(snapLama.payload);
    } else {
      await terapkanRingkasanDenganAntrean({ totalKunjungan: 0, totalNominal: 0, bayar: 0, janji: 0, belum: 0 });
    }

    if (typeof navigator !== 'undefined' && !navigator.onLine) return;

    try {
      const res = await AppAPI.call('getRingkasanKunjunganHariIni', {
        namaPetugas: user.namaPetugas,
        level: user.level
      });
      if (!res || !res.sukses) return;

      const stats = {
        totalKunjungan: res.totalKunjungan || 0,
        totalNominal: res.totalNominal || 0,
        bayar: res.bayar || 0,
        janji: res.janji || 0,
        belum: res.belum || 0
      };
      saveKunjSnapshot(snapKey, stats);
      await terapkanRingkasanDenganAntrean(stats);
    } catch (e) {}
  };

  return {
    render,
    flushKunjunganOfflineQueue,
    kembaliKeTagihan,
    setTransportasi,
    onInputTransportasi,
    toggleResponAnggota,
    fokusCariRombongan,
    onKetikCariRombongan,
    pilihAnggotaRombongan,
    tambahRombonganCepat,
    onInputNominalRombongan,
    isiTagihanRombongan,
    ubahFieldRombongan,
    hapusAnggotaRombongan,
    setNominalUtama,
    onInputNominalUtama,
    hapusTtd,
    aktifkanTtdBaru,
    kembaliKeTtdTersimpan,
    setJenisPenagihan,
    bukaModalTim,
    renderListKapsulTim,
    toggleKapsulTim,
    pilihSemuaTimModal,
    kosongkanTimModal,
    terapkanTim,
    hapusSatuAnggotaTim,
    setKategori,
    setStatusKunjungan,
    toggleDropdownSkenario,
    pilihSkenarioByIdx,
    pilihSkenarioCustom,
    onInputCatatanChange,
    setQuickTanggal,
    cariAnggota,
    ambilGPS,
    handleFoto,
    hapusFoto,
    resetForm,
    submitForm
  };
})();
</script>
